<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="body-donde-va-la-confimacionPHP">
    <div class="clase-de-mi-registro-exitoso">
      <span class="confirmacion-de-regristro-correcto">✓</span>
      <p class="parrafo-dideño-div-confirmacion"></p>
    </div>
     
   <script src="app.js"></script>
   <script>
    const elementodeCorfimacionderegistro = document.querySelector(".parrafo-dideño-div-confirmacion")
     

       const basmanSUPERMAmujerMaravila= localStorage.getItem("ingresoexitosoParacambiar") || "";
       const lamparacascoelquesemuere= localStorage.getItem("mensajeConfirmacion") || "";
       const otraconFirmacionRapida= localStorage.getItem("mensajeComentario") || "";
       const siriaco = localStorage.getItem("mensajeCambioContraseña") || "";
       const confir = localStorage.getItem("mensajeModificacion") || "";
       const contacto = localStorage.getItem("mensagecontacto") || "";
       
                               
      if(lamparacascoelquesemuere){
         elementodeCorfimacionderegistro.textContent = lamparacascoelquesemuere;
      }else if(basmanSUPERMAmujerMaravila){
        elementodeCorfimacionderegistro.textContent = basmanSUPERMAmujerMaravila;
      }else if(otraconFirmacionRapida){
        elementodeCorfimacionderegistro.textContent = otraconFirmacionRapida;
      }else if(siriaco){
        elementodeCorfimacionderegistro.textContent = siriaco;
      }else if(confir){
        elementodeCorfimacionderegistro.textContent = confir;
      }else if(contacto){
       elementodeCorfimacionderegistro.textContent = contacto;
      }

     setTimeout(() => {
      localStorage.removeItem("mensajeConfirmacion");
      localStorage.removeItem("ingresoexitosoParacambiar");
      localStorage.removeItem("mensajeComentario");
      localStorage.removeItem("mensajeCambioContraseña");
      localStorage.removeItem("mensajeModificacion");
      localStorage.removeItem("mensagecontacto");
      window.location.href = "./index.html";
     }, 5000);

</script> 
</body>
</html>
