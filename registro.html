<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=1">
</head>
<body class="body-del-registrophp">
 <section class="card-registro-para-mi-archivo-de-registro">
    <div class="encavezado-de-mi-ingresar-php">
      <a href="index.html"  class="btn-back-milo">
      <i id="identificador-css" class="fa-solid fa-arrow-left"></i>
      </a>
      <p class="gorra-para-que-vea">TuSOAT</p>
    </div>
 <form  class="formulario-importante-para-crear">
  <input
    type="text"
    name="nombre"
    placeholder="Nombre completo"
    required
  >

  <select name="tipoDocumento" required>
    <option value="">Tipo de documento</option>
    <option value="CC">Cédula de ciudadanía</option>
    <option value="CE">Cédula de extranjería</option>
    <option value="TI">Tarjeta de identidad</option>
    <option value="PP">Pasaporte</option>
    <option value="NIT">NIT</option>
  </select>

  <input
    type="text"
    name="numeroDocumento"
    placeholder="Número de documento"
    required
  >

  <input
    type="email"
    name="correo"
    placeholder="Correo electrónico"
    required
  >

  <input
    type="tel"
    name="celular"
    placeholder="Número de celular"
    required
  >

  <input
    type="password"
    name="password"
    placeholder="Contraseña"
    required
  >

  <input
    type="password"
    name="confirmarPassword"
    placeholder="Confirmar contraseña"
    required
  >

  <button type="submit">
    Crear cuenta
  </button>

 </form>
</section>

   <script src="app.js"></script> 
</body>
</html>
