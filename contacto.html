<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documento</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="contenedor-principal-arcivo-descarga">

    <div class="color-fondo">

        <section class="teclado-malo">
               <a href="index.html"  class="btn-back-milo">
                <i id="identificador-css" class="fa-solid fa-arrow-left"></i>
               </a>
               <p class="gorra-para-que-vea">TuSOAT</p>
        </section>

         <div class="cuerpo-del-encavezado" >
              <form class="formulario">

                <div class="grupo">
                 <label>Nombre</label>
                 <input type="text" placeholder="Ingresa tu nombre">
                </div>

                <div class="grupo">
                 <label>Correo</label>
                 <input type="email" placeholder="Ingresa tu correo">
                </div>

                <div class="grupo">
                 <label>Mensaje</label>
                 <textarea placeholder="Escribe tu mensaje"></textarea>
                </div>

                <button type="submit" class="boton">
                  Enviar Mensaje
                 </button>

               </form>
        </div>
    </div>

   <script src="app.js"></script> 
</body>

</html>
